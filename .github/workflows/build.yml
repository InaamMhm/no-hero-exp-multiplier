name: Build

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: noheroexpmultiplier
  MELONLOADER_VERSION: v0.7.3
  MOD_HELPER_VERSION: 3.6.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mod
        uses: actions/checkout@v4

      - name: Check out BTD6 references
        uses: actions/checkout@v4
        with:
          repository: doombubbles/btd6-ci-dependencies
          ref: 16c042bd6eda0d7bf6b19321a966d7b0847c4fee
          path: dependencies/BloonsTD6/MelonLoader/Il2CppAssemblies

      - name: Download build dependencies
        shell: bash
        run: |
          curl -fL --retry 3 "https://github.com/LavaGang/MelonLoader/releases/download/${MELONLOADER_VERSION}/MelonLoader.x64.zip" -o melonloader.zip
          unzip -q -o melonloader.zip -d dependencies/BloonsTD6
          mkdir -p dependencies/BloonsTD6/Mods
          curl -fL --retry 3 "https://github.com/gurrenm3/BTD-Mod-Helper/releases/download/${MOD_HELPER_VERSION}/Btd6ModHelper.dll" -o dependencies/BloonsTD6/Mods/Btd6ModHelper.dll

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release -p:BloonsTD6="${{ github.workspace }}/dependencies/BloonsTD6" "${{ env.PROJECT_NAME }}.csproj"

      - name: Upload mod DLL
        uses: actions/upload-artifact@v4
        with:
          name: noheroexpmultiplier
          path: bin/Release/noheroexpmultiplier.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: noheroexpmultiplier
          path: release
      - name: Check tag matches mod version
        shell: bash
        run: |
          version=$(sed -n 's/.*const string Version = "\([^"]*\)";.*/\1/p' ModHelperData.cs)
          test "${GITHUB_REF_NAME#v}" = "$version"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/noheroexpmultiplier.dll
          body_path: LATEST.md
          fail_on_unmatched_files: true
